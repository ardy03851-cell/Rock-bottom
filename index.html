<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#07080f">
    <title>The Shape of Two</title>
    <style>
        :root {
            color-scheme: dark;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #05060c;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            font-family: Georgia, 'Times New Roman', serif;
            overscroll-behavior: none;
        }

        #stage {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }
    </style>
</head>

<body>
    <canvas id="stage"></canvas>
    <script src="models.js"></script>
    <script>
        (function () {
'use strict';

const M = Models;
const { clamp, lerp, rand, dist, Ease, TAU } = M;

/* =========================================================
   CANVAS
   ========================================================= */
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d', { alpha: false });
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.round(canvas.clientWidth || window.innerWidth);
  H = Math.round(canvas.clientHeight || window.innerHeight);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  onResize();
}

/* =========================================================
   AUDIO  (tiny ambient pad + soft chimes)
   ========================================================= */
const Audio_ = {
  ctx: null, master: null, voices: [], ready: false, muted: false,
  unlock() {
    if (this.ready) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      const c = this.ctx;
      this.master = c.createGain();
      this.master.gain.value = 0;
      const filt = c.createBiquadFilter();
      filt.type = 'lowpass';
      filt.frequency.value = 720;
      filt.Q.value = 0.6;
      filt.connect(this.master);
      this.master.connect(c.destination);

      // slow breathing LFO
      const lfo = c.createOscillator();
      lfo.frequency.value = 0.06;
      const lfoGain = c.createGain();
      lfoGain.gain.value = 0.022;
      lfo.connect(lfoGain);
      lfoGain.connect(this.master.gain);
      lfo.start();

      for (let i = 0; i < 4; i++) {
        const o = c.createOscillator();
        o.type = i === 0 ? 'sine' : 'sine';
        o.frequency.value = 110 * (1 + i * 0.5);
        o.detune.value = (i - 1.5) * 7;
        const g = c.createGain();
        g.gain.value = 0.22 / (1 + i * 0.7);
        o.connect(g); g.connect(filt);
        o.start();
        this.voices.push({ o, g, ratio: 1 + i * 0.5 });
      }
      this.master.gain.setTargetAtTime(0.075, c.currentTime, 3.0);
      this.ready = true;
    } catch (e) { /* silent */ }
  },
  setRoot(f) {
    if (!this.ready) return;
    const t = this.ctx.currentTime;
    this.voices.forEach(v => v.o.frequency.setTargetAtTime(f * v.ratio, t, 1.6));
  },
  chime(freq, vol) {
    if (!this.ready || this.muted) return;
    try {
      const c = this.ctx, t = c.currentTime;
      const o = c.createOscillator();
      o.type = 'sine';
      o.frequency.value = freq;
      const g = c.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol || 0.045, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.9);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + 2.0);
    } catch (e) {}
  }
};

/* =========================================================
   STATE
   ========================================================= */
const S = {
  t: 0,
  mood: 'birth', prevMood: 'birth', moodT: 1,
  spike: null, ashes: null, softs: [],
  sparks: [], motes: [], stars: null,
  text: '', hint: '', hintA: 0,
  shake: 0, flash: 0, flashCol: '#ffffff',
  holdT: 0, holdNeed: 0, holding: false,
  dragging: false, pointerX: 0, pointerY: 0,
  touched: false, aligned: false, ended: false,
  endT: 0
};

let step = null, cur = 0, stepTime = 0;
let textShown = 0, textTotal = 0, revealDone = false;
let layoutCache = null, layoutKey = '';
let fadeIn = 1;

/* =========================================================
   BACKGROUND
   ========================================================= */
function currentMood() {
  const a = M.Moods[S.prevMood] || M.Moods.birth;
  const b = M.Moods[S.mood] || M.Moods.birth;
  return M.mixMood(a, b, Ease.inOutSine(clamp(S.moodT, 0, 1)));
}

function drawBackground(P) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, M.arr(P.sky[0], 1));
  g.addColorStop(1, M.arr(P.sky[1], 1));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // soft horizon bloom
  const hg = ctx.createRadialGradient(W * 0.5, H * 0.55, 0, W * 0.5, H * 0.55, Math.max(W, H) * 0.8);
  hg.addColorStop(0, M.arr(P.glow, 0.075));
  hg.addColorStop(0.55, M.arr(P.glow, 0.022));
  hg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = hg;
  ctx.fillRect(0, 0, W, H);

  // stars
  if (P.stars > 0.01) {
    if (!S.stars) S.stars = new M.Stars(W, H, Math.round((W * H) / 13000));
    S.stars.draw(ctx, S.t, clamp(P.stars, 0, 1), P.accent);
  }
}

function drawVignette() {
  const v = ctx.createRadialGradient(W * 0.5, H * 0.5, Math.min(W, H) * 0.22, W * 0.5, H * 0.5, Math.max(W, H) * 0.8);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(0.7, 'rgba(0,0,0,0.35)');
  v.addColorStop(1, 'rgba(0,0,0,0.86)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
}

/* =========================================================
   TEXT
   ========================================================= */
function getLayout(raw, font, maxW) {
  const key = raw + '|' + font + '|' + Math.round(maxW);
  if (layoutKey === key && layoutCache) return layoutCache;
  ctx.font = font;
  const lines = [];
  let idx = 0;
  const paras = raw.split('\n');
  paras.forEach((para, pi) => {
    if (para.trim() === '') { lines.push({ text: '', start: idx }); idx += 1; return; }
    const words = para.split(' ');
    let line = '';
    for (let i = 0; i < words.length; i++) {
      const test = line ? line + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width > maxW && line) {
        lines.push({ text: line, start: idx });
        idx += line.length + 1;
        line = words[i];
      } else {
        line = test;
      }
    }
    lines.push({ text: line, start: idx });
    idx += line.length;
    if (pi < paras.length - 1) idx += 1;
  });
  layoutCache = { lines, total: Math.max(1, idx) };
  layoutKey = key;
  return layoutCache;
}

function drawStoryText() {
  if (!S.text) return;
  const fs = clamp(Math.min(W, H) * 0.0295, 15, 22);
  const font = '300 ' + fs + 'px Georgia, "Times New Roman", serif';
  const maxW = Math.min(W * 0.82, 600);
  const lay = getLayout(S.text, font, maxW);
  const lh = fs * 1.78;
  const blockH = lay.lines.length * lh;
  const pad = Math.max(58, H * 0.10);
  const top = clamp(H - pad - blockH, H * 0.44, H);
  const colX = W * 0.5 - maxW * 0.5;

  ctx.save();
  ctx.font = font;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';

  let cursorX = 0, cursorY = 0, cursorOn = false;

  for (let i = 0; i < lay.lines.length; i++) {
    const ln = lay.lines[i];
    const y = top + i * lh + lh * 0.5;
    const n = clamp(Math.floor(textShown) - ln.start, 0, ln.text.length);
    if (n <= 0) continue;
    const vis = ln.text.slice(0, n);

    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillText(vis, colX + 1, y + 1);
    ctx.fillStyle = 'rgba(233,232,240,0.94)';
    ctx.fillText(vis, colX, y);

    if (n < ln.text.length) {
      cursorX = colX + ctx.measureText(vis).width + 3;
      cursorY = y;
      cursorOn = true;
    }
  }
  ctx.restore();

  if (cursorOn && !revealDone) {
    const pulse = 0.45 + 0.4 * Math.sin(S.t * 7);
    const P = currentMood();
    ctx.fillStyle = M.arr(P.accent, pulse);
    ctx.beginPath();
    ctx.arc(cursorX, cursorY + 1, 2.0, 0, TAU);
    ctx.fill();
  }
}

function drawSpaced(text, cx, y, size, spacing, color, alpha) {
  ctx.save();
  ctx.font = '400 ' + size + 'px Georgia, "Times New Roman", serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  let total = 0;
  for (const ch of text) total += ctx.measureText(ch).width + spacing;
  total -= spacing;
  let x = cx - total / 2;
  ctx.fillStyle = color;
  ctx.globalAlpha = alpha;
  for (const ch of text) {
    ctx.fillText(ch, x, y);
    x += ctx.measureText(ch).width + spacing;
  }
  ctx.restore();
}

function drawHint() {
  if (!S.hint || S.hintA < 0.02) return;
  const size = clamp(Math.min(W, H) * 0.019, 10, 13);
  const y = H - Math.max(26, H * 0.045);
  const pulse = 0.35 + 0.35 * Math.sin(S.t * 2.0);
  drawSpaced(S.hint.toUpperCase(), W * 0.5, y, size,
    size * 0.34, 'rgba(230,230,240,1)', S.hintA * pulse);
}

/* =========================================================
   ACTOR DRAWING
   ========================================================= */
function drawActors() {
  const P = currentMood();
  if (S.softs) for (const s of S.softs) s.draw(ctx);
  if (S.ashes) S.ashes.draw(ctx);
  if (S.spike) S.spike.draw(ctx);
  for (const p of S.sparks) p.draw(ctx);
}

function drawMotes(P, back) {
  for (let i = 0; i < S.motes.length; i++) {
    if ((i % 2 === 0) === back) S.motes[i].draw(ctx, i % 3 === 0 ? M.arr(P.accent, 1) : M.arr(P.glow, 1));
  }
}

/* =========================================================
   STEP RUNNER
   ========================================================= */
function goTo(i) {
  cur = i;
  step = STEPS[i];
  stepTime = 0;
  revealDone = false;
  textShown = 0;
  S.text = step.text || '';
  S.hint = step.hint || '';
  S.hintA = S.hint ? 1 : 0;
  S.holdT = 0;
  S.holding = false;
  if (step.mood && step.mood !== S.mood) {
    S.prevMood = S.mood;
    S.mood = step.mood;
    S.moodT = 0;
    if (M.Moods[S.mood] && M.Moods[S.mood].root) Audio_.setRoot(M.Moods[S.mood].root);
  }
  if (M.CHORD[S.mood]) Audio_.setRoot(M.CHORD[S.mood]);
  layoutCache = null;
  if (step.enter) step.enter(S);
}

function advance() {
  if (cur < STEPS.length - 1) {
    goTo(cur + 1);
    Audio_.chime(440 + Math.random() * 60, 0.018);
  } else if (!S.ended) {
    S.ended = true;
    S.endT = 0;
  }
}

function tap() {
  if (S.ended) {
    S.ended = false;
    fadeIn = 1;
    goTo(0);
    return;
  }
  if (!revealDone) {
    textShown = textTotal;
    revealDone = true;
    return;
  }
  if (step && step.gate && !step.gate(S)) {
    S.shake = Math.min(1, S.shake + 0.25);
    return;
  }
  advance();
}

/* =========================================================
   INPUT
   ========================================================= */
let downX = 0, downY = 0, downT = 0, moved = false;

function pos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

canvas.addEventListener('pointerdown', function (e) {
  if (!e.isPrimary) return;
  e.preventDefault();
  Audio_.unlock();
  const p = pos(e);
  downX = p.x; downY = p.y; downT = performance.now(); moved = false;
  S.dragging = true; S.holding = true;
  S.pointerX = p.x; S.pointerY = p.y;
  if (step && step.onDown) step.onDown(S, p.x, p.y);
}, { passive: false });

canvas.addEventListener('pointermove', function (e) {
  if (!e.isPrimary || !S.dragging) return;
  e.preventDefault();
  const p = pos(e);
  if (Math.hypot(p.x - downX, p.y - downY) > 12) moved = true;
  S.pointerX = p.x; S.pointerY = p.y;
  if (step && step.onDrag) step.onDrag(S, p.x, p.y);
}, { passive: false });

function release(e) {
  if (!e.isPrimary) return;
  S.dragging = false; S.holding = false;
  if (step && step.onUp) step.onUp(S);
  if (!moved) tap();
}
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', function (e) { S.dragging = false; S.holding = false; });

window.addEventListener('keydown', function (e) {
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); Audio_.unlock(); tap(); }
});

/* =========================================================
   STORY
   ========================================================= */
const STEPS = [];

/* ---------- helpers ---------- */
function stageY() { return H * 0.40; }
function unit() { return Math.min(W, H); }

function burst(x, y, color, n, power) {
  for (let i = 0; i < n; i++) {
    S.sparks.push(new M.Spark(x, y, color, {
      angle: rand(0, TAU),
      speed: rand(30, power || 190),
      life: rand(0.35, 1.15),
      r: rand(0.9, 2.6)
    }));
  }
}

function makeSpike(x, y, size) {
  const sp = new M.Spike({
    x: x, y: y,
    size: size,
    color: '#ffd9a0',
    edge: '#fff6e2'
  });
  sp.homeX = x; sp.homeY = y;
  return sp;
}

/* =========================================================
   TITLE
   ========================================================= */
STEPS.push({
  titleMode: true,
  mood: 'birth',
  enter: function (S) {
    S.softs = []; S.sparks = [];
    S.spike = makeSpike(W * 0.5, stageY(), unit() * 0.075);
    S.spike.alpha = 0;
    S.spike.rot = 0;
    S.text = '';
    S.hint = 'tap';
  },
  update: function (S, dt) {
    S.spike.alpha = Math.min(1, S.spike.alpha + dt * 0.4);
    S.spike.rot += dt * 0.14;
    S.spike.homeX = W * 0.5;
    S.spike.homeY = stageY();
    S.spike.x = W * 0.5;
    S.spike.y = stageY();
  }
});

/* =========================================================
   I — THE SOFT WORLD
   ========================================================= */
STEPS.push({
  mood: 'birth',
  text: 'Before anything, there was a warm dark.\nAnd in the warm dark, shapes began.',
  enter: function (S) {
    S.sparks = [];
    S.softs = [];
    const cols = ['#7fb2ff', '#8fe0d0', '#c9a6ff', '#ffb0c8', '#a3d9a5'];
    const n = 5;
    for (let i = 0; i < n; i++) {
      const a = Math.PI + (i / (n - 1)) * Math.PI;
      const s = new M.Soft({
        x: W * 0.5 + Math.cos(a) * W * 0.36,
        y: H * 0.30 - Math.sin(a) * H * 0.11,
        r: unit() * rand(0.036, 0.055),
        color: cols[i]
      });
      s.driftAmp = rand(2, 7);
      S.softs.push(s);
    }
    S.spike.homeX = W * 0.5;
    S.spike.homeY = H * 0.52;
    S.spike.x = W * 0.5;
    S.spike.y = H * 0.52;
    S.spike.sharp = 1;
    S.spike.alpha = 1;
    S.spike.rot = 0;
  }
});

STEPS.push({
  mood: 'birth',
  text: 'Most of them were round.'
});

STEPS.push({
  mood: 'birth',
  text: 'They rolled into one another and nothing broke.\nThey bumped, and bounced, and made a sound like laughing.'
});

STEPS.push({
  mood: 'birth',
  text: 'You were not round.'
});

STEPS.push({
  mood: 'birth',
  text: 'You were three straight lines and three points.\nAnd the first time you touched someone, they flinched.'
});

/* --- interaction: reach out --- */
STEPS.push({
  mood: 'birth',
  text: 'Reach out.',
  hint: 'drag toward one of them',
  enter: function (S) { S.touched = false; },
  onDrag: function (S, x, y) {
    S.spike.x = clamp(x, 20, W - 20);
    S.spike.y = clamp(y, 20, H - 20);
    for (const s of S.softs) {
      if (s.hurtYet) continue;
      if (dist(S.spike.x, S.spike.y, s.px, s.py) < s.r + S.spike.size * 0.55) {
        s.hurtYet = true;
        s.flinch = 1;
        s.addCrack(Math.atan2(S.spike.y - s.py, S.spike.x - s.px));
        const ang = Math.atan2(s.py - S.spike.y, s.px - S.spike.x);
        s.x += Math.cos(ang) * 26;
        s.y += Math.sin(ang) * 26;
        burst(s.px, s.py, '#ff9fae', 16, 220);
        S.shake = 1;
        S.flash = 0.5;
        S.flashCol = '#ffd0d8';
        S.touched = true;
        Audio_.chime(196, 0.05);
      }
    }
  },
  gate: function (S) { return S.touched; }
});

STEPS.push({
  mood: 'break',
  text: 'They flinched.\nAnd there was a mark on them, exactly the shape of you.'
});

STEPS.push({
  mood: 'break',
  text: 'You did not mean to.\nYou never meant to.'
});

STEPS.push({
  mood: 'break',
  text: 'But meaning it was never the problem.'
});

/* =========================================================
   II — LEARNING
   ========================================================= */
STEPS.push({
  mood: 'dull',
  text: 'So you learned.',
  enter: function (S) {
    S.sparks = [];
    S.softs.forEach(function (s, i) {
      s.homeX = W * 0.5 + Math.cos(i * 1.28) * W * 0.34;
      s.homeY = H * 0.30 + Math.sin(i * 1.28) * H * 0.10;
      s.hurtYet = true;
    });
    S.spike.homeX = W * 0.5;
    S.spike.homeY = H * 0.60;
  }
});

STEPS.push({
  mood: 'dull',
  text: 'You learned to stand one arm\'s length away.\nThen two.'
});

STEPS.push({
  mood: 'dull',
  text: 'You learned to be funny, so that people would come close\nwithout actually coming close.'
});

STEPS.push({
  mood: 'dull',
  text: 'Everyone loves a sharp thing from across the room.'
});

STEPS.push({
  mood: 'dull',
  text: 'At night you pressed your points into the ground and tried to wear them down.\nThe ground did not care.\nThe points stayed.',
  enter: function (S) {
    S.spike.rot = Math.PI;
    S.spike.homeY = H * 0.48;
    S.spike.y = H * 0.48;
  }
});

/* =========================================================
   III — WREN
   ========================================================= */
STEPS.push({
  mood: 'love',
  text: 'Then there was Wren.',
  enter: function (S) {
    S.softs = [];
    S.sparks = [];
    const wren = new M.Soft({
      x: W * 0.5, y: H * 0.32,
      r: unit() * 0.075,
      color: '#ffc7d1'
    });
    wren.driftAmp = 2.4;
    S.softs.push(wren);
    S.spike.homeX = W * 0.5;
    S.spike.homeY = H * 0.62;
    S.spike.x = S.spike.homeX;
    S.spike.y = S.spike.homeY;
    S.spike.rot = 0;
    S.spike.sharp = 1;
  }
});

STEPS.push({
  mood: 'love',
  text: 'Wren was round. Wren was the roundest thing you had ever seen,\nand when she laughed the whole room went soft.'
});

STEPS.push({
  mood: 'love',
  text: 'Wren was not afraid of you.\nThat was the terrible part.'
});

STEPS.push({
  mood: 'love',
  text: 'She came close. She said: I know what you are.\nI am not going anywhere.'
});

STEPS.push({
  mood: 'love',
  text: 'Move closer.',
  hint: 'drag yourself toward her',
  enter: function (S) {
    S.danger = 0;
  },
  onDrag: function (S, x, y) {
    const w = S.softs[0];
    const dx = x - S.spike.x, dy = y - S.spike.y;
    S.spike.x = clamp(x, 20, W - 20);
    S.spike.y = clamp(y, 20, H - 20);
    const d = dist(S.spike.x, S.spike.y, w.px, w.py);
    const gap = d - (w.r + S.spike.size * 0.6);
    S.danger = clamp(1 - gap / (unit() * 0.16), 0, 1);
    if (S.danger > 0.92) {
      if (!w.hurtYet) {
        w.hurtYet = true;
        w.flinch = 1;
        w.addCrack(Math.atan2(S.spike.y - w.py, S.spike.x - w.px) + 0.4);
        w.addCrack(Math.atan2(S.spike.y - w.py, S.spike.x - w.px) - 0.6);
        burst(w.px, w.py, '#ffb0c0', 26, 260);
        S.shake = 1.4;
        S.flash = 0.75;
        S.flashCol = '#ffd6de';
        S.touched = true;
        Audio_.chime(146, 0.07);
      }
    }
  },
  gate: function (S) { return S.touched === true; }
});

STEPS.push({
  mood: 'break',
  text: 'She did not scream.'
});

STEPS.push({
  mood: 'break',
  text: 'She said: it\'s okay.\nShe said it with a crack running down her side.\nShe said it while looking at you.'
});

STEPS.push({
  mood: 'break',
  text: 'And that was when you understood what you were.'
});

/* =========================================================
   UPDATE
   ========================================================= */
function updateActors(dt) {
  if (S.spike) S.spike.update(dt);
  if (S.ashes) S.ashes.update(dt);
  for (const s of S.softs) s.update(dt);
  for (let i = S.sparks.length - 1; i >= 0; i--) {
    S.sparks[i].update(dt);
    if (S.sparks[i].dead) S.sparks.splice(i, 1);
  }
  for (const m of S.motes) m.update(dt, S.t);
}

function update(dt) {
  S.t += dt;
  S.moodT = Math.min(1, S.moodT + dt / 2.6);
  stepTime += dt;

  if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 2.6);
  if (S.flash > 0) S.flash = Math.max(0, S.flash - dt * 1.9);

  // text reveal
  if (S.text) {
    const fs = clamp(Math.min(W, H) * 0.0295, 15, 22);
    const font = '300 ' + fs + 'px Georgia, "Times New Roman", serif';
    const maxW = Math.min(W * 0.82, 600);
    const lay = getLayout(S.text, font, maxW);
    textTotal = lay.total;
    if (!revealDone) {
      textShown += dt * 46;
      if (textShown >= textTotal) {
        textShown = textTotal;
        revealDone = true;
      }
    }
  } else {
    revealDone = true;
  }

  // hint fade
  const targetHint = S.hint ? 1 : 0;
  S.hintA += (targetHint - S.hintA) * Math.min(1, dt * 3);

  if (step && step.update) step.update(S, dt);
  updateActors(dt);

  // end sequence
  if (S.ended) {
    S.endT += dt;
    if (S.endT > 9) {
      S.endT = 0;
      S.ended = false;
      goTo(0);
    }
  }
}

/* =========================================================
   RENDER
   ========================================================= */
function render() {
  const P = currentMood();

  ctx.save();

  if (S.shake > 0.001) {
    const s = S.shake * S.shake * 9;
    ctx.translate(rand(-s, s), rand(-s, s));
  }

  drawBackground(P);
  drawMotes(P, true);

  if (step && step.titleMode) {
    // Title screen
    const a = S.spike ? S.spike.alpha : 1;
    const ty = H * 0.24;
    drawSpaced('THE SHAPE OF TWO', W * 0.5, ty, clamp(unit() * 0.052, 22, 44),
      clamp(unit() * 0.014, 4, 12), 'rgba(240,238,248,1)', a * 0.95);
    drawSpaced('a story about a triangle', W * 0.5, ty + clamp(unit() * 0.055, 26, 50),
      clamp(unit() * 0.020, 11, 15), clamp(unit() * 0.006, 1.5, 4),
      'rgba(190,190,215,1)', a * 0.62);
  } else {
    drawActors();
  }

  drawMotes(P, false);
  drawVignette();

  // title-mode triangle is drawn between back motes and vignette
  if (step && step.titleMode && S.spike) {
    S.spike.draw(ctx);
  }

  ctx.restore();

  // danger vignette (chapter III)
  if (S.danger > 0.01 && !S.touched) {
    const d = S.danger;
    const r = ctx.createRadialGradient(W * 0.5, H * 0.45, Math.min(W, H) * 0.15,
                                        W * 0.5, H * 0.45, Math.max(W, H) * 0.7);
    r.addColorStop(0, 'rgba(255,90,110,0)');
    r.addColorStop(1, 'rgba(255,60,90,' + (0.34 * d) + ')');
    ctx.fillStyle = r;
    ctx.fillRect(0, 0, W, H);
  }

  // story text
  if (!(step && step.titleMode)) drawStoryText();
  else if (S.text) drawStoryText();

  // hint
  drawHint();

  // flash
  if (S.flash > 0.001) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = M.rs(S.flashCol, S.flash * 0.42);
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  // ending overlay
  if (S.ended) {
    const a = clamp(S.endT / 2.6, 0, 1) * clamp((9 - S.endT) / 2.4, 0, 1);
    ctx.fillStyle = 'rgba(4,4,10,' + (a * 0.82) + ')';
    ctx.fillRect(0, 0, W, H);
    if (S.endT > 3.2) {
      const ta = clamp((S.endT - 3.2) / 1.8, 0, 1) * clamp((9 - S.endT) / 2.0, 0, 1);
      drawSpaced('the end', W * 0.5, H * 0.5, clamp(unit() * 0.022, 12, 16),
        clamp(unit() * 0.010, 3, 8), 'rgba(230,228,240,1)', ta * 0.7);
    }
  }

  // intro fade
  if (fadeIn > 0.001) {
    ctx.fillStyle = 'rgba(4,4,10,' + fadeIn + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

/* =========================================================
   LOOP
   ========================================================= */
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  if (fadeIn > 0) fadeIn = Math.max(0, fadeIn - dt * 0.35);

  update(dt);
  render();
  requestAnimationFrame(frame);
}

/* =========================================================
   RESIZE / BOOT
   ========================================================= */
function onResize() {
  S.motes = [];
  for (let i = 0; i < 44; i++) S.motes.push(new M.Mote(W, H, true));
  S.stars = null;
  layoutCache = null;
  if (step && step.enter) {
    const wasTitle = !!step.titleMode;
    step.enter(S);
    if (!wasTitle && S.spike) S.spike.alpha = 1;
  }
}

let resizeTimer = null;
window.addEventListener('resize', function () {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(resize, 180);
});
window.addEventListener('orientationchange', function () {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(resize, 320);
});

// boot
resize();
S.motes = [];
for (let i = 0; i < 44; i++) S.motes.push(new M.Mote(W, H, true));
goTo(0);
requestAnimationFrame(function (t) { last = t; requestAnimationFrame(frame); });

})();
