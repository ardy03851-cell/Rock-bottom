<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Sharpness of Being</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0909;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            touch-action: none; /* Prevents iPad scrolling */
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #text-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 600px;
            text-align: center;
            color: rgba(255, 255, 255, 0.85);
            font-size: 1.2rem;
            line-height: 1.8;
            letter-spacing: 2px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            font-weight: 300;
        }
        .chapter-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 20px;
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="text-overlay">
        <span class="chapter-title" id="chapter-title"></span>
        <span id="story-text"></span>
    </div>

    <script src="models.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const textOverlay = document.getElementById('text-overlay');
        const chapterTitle = document.getElementById('chapter-title');
        const storyText = document.getElementById('story-text');

        let width, height;
        let dpr = window.devicePixelRatio || 1;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
        }
        window.addEventListener('resize', resize);
        resize();

        // Audio Context for procedural ambient sound
        let audioCtx;
        let droneOsc;
        let droneGain;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                // Deep, sad drone
                droneOsc = audioCtx.createOscillator();
                droneGain = audioCtx.createGain();
                droneOsc.type = 'sine';
                droneOsc.frequency.setValueAtTime(55, audioCtx.currentTime); // A1
                
                const lfo = audioCtx.createOscillator();
                const lfoGain = audioCtx.createGain();
                lfo.type = 'sine';
                lfo.frequency.setValueAtTime(0.1, audioCtx.currentTime); // Very slow pulse
                lfoGain.gain.setValueAtTime(2, audioCtx.currentTime);
                
                lfo.connect(lfoGain);
                lfoGain.connect(droneOsc.frequency);
                
                droneOsc.connect(droneGain);
                droneGain.connect(audioCtx.destination);
                
                droneGain.gain.setValueAtTime(0.05, audioCtx.currentTime); // Very quiet
                
                droneOsc.start();
                lfo.start();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Game State
        const game = {
            state: 'title', // title, playing, transitioning
            chapter: 0,
            transitionAlpha: 0,
            targetAlpha: 0,
            transitionDirection: 0, // -1 fade out, 1 fade in
            transitionCallback: null
        };

        // Entities
        let sharp, soft, environment;
        let particles = [];
        let camera = { x: 0, y: 0, scale: 1, targetX: 0, targetY: 0, targetScale: 1 };

        // Input handling
        let isDragging = false;
        let dragOffset = { x: 0, y: 0 };
        let touchStart = { x: 0, y: 0 };

        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) - camera.x,
                y: (clientY - rect.top) - camera.y
            };
        }

        function handleStart(e) {
            initAudio();
            if (game.state === 'title') {
                startChapter(1);
                return;
            }
            const pos = getPointerPos(e);
            // Check if touching near the sharp entity
            const dist = Math.hypot(pos.x - sharp.pos.x, pos.y - sharp.pos.y);
            if (dist < 150 * camera.scale) {
                isDragging = true;
                dragOffset.x = sharp.pos.x - pos.x;
                dragOffset.y = sharp.pos.y - pos.y;
            }
        }

        function handleMove(e) {
            if (!isDragging || game.state !== 'playing') return;
            e.preventDefault();
            const pos = getPointerPos(e);
            sharp.targetPos.x = pos.x + dragOffset.x;
            sharp.targetPos.y = pos.y + dragOffset.y;
        }

        function handleEnd() {
            isDragging = false;
        }

        canvas.addEventListener('mousedown', handleStart);
        canvas.addEventListener('mousemove', handleMove);
        canvas.addEventListener('mouseup', handleEnd);
        canvas.addEventListener('touchstart', handleStart, { passive: false });
        canvas.addEventListener('touchmove', handleMove, { passive: false });
        canvas.addEventListener('touchend', handleEnd);

        // Story Engine
        const storyData = [
            {
                title: "I. The Edge",
                text: "I was born with edges. I didn't know they cut.",
                setup: () => {
                    sharp = new SharpShape(width/2, height/2 + 100);
                    environment = new Environment(width, height, 0);
                    camera.targetScale = 1;
                    camera.targetX = -width/2 + width/2; // Center
                    camera.targetY = -height/2 + height/2;
                    textOverlay.style.color = 'rgba(255, 255, 255, 0.6)';
                },
                update: (dt) => {
                    // Sharp just floats
                }
            },
            {
                title: "II. The Warmth",
                text: "I found warmth. I reached out. The warmth bled.",
                setup: () => {
                    soft = new SoftShape(width/2, height/2 - 50, 'circle');
                    environment = new Environment(width, height, 1);
                    camera.targetScale = 1.5;
                    camera.targetX = -width/2 + width/2;
                    camera.targetY = -height/2 + height/2;
                    textOverlay.style.color = 'rgba(255, 200, 200, 0.8)';
                },
                update: (dt) => {
                    soft.update(dt);
                    // Check collision
                    const dist = Math.hypot(sharp.pos.x - soft.pos.x, sharp.pos.y - soft.pos.y);
                    if (dist < 80) {
                        triggerShatter(soft);
                        soft = null;
                        game.transitionCallback = () => startChapter(3);
                    }
                }
            },
            {
                title: "III. The Distance",
                text: "So I built walls of distance. The further I am, the safer you are.",
                setup: () => {
                    sharp = new SharpShape(width/2, height - 100);
                    environment = new Environment(width, height, 2);
                    camera.targetScale = 0.8;
                    camera.targetX = -width/2 + width/2;
                    camera.targetY = -height/2 + height/2;
                    textOverlay.style.color = 'rgba(150, 150, 200, 0.6)';
                },
                update: (dt) => {
                    // Sharp retreats
                }
            },
            {
                title: "IV. The Cruel Gravity",
                text: "But even the cosmos pushes. A cruel gravity. I am sorry.",
                setup: () => {
                    sharp = new SharpShape(width/2 - 200, height/2);
                    soft = new SoftShape(width/2 + 200, height/2, 'ribbon');
                    environment = new Environment(width, height, 3);
                    camera.targetScale = 1.2;
                    camera.targetX = -width/2 + width/2;
                    camera.targetY = -height/2 + height/2;
                    textOverlay.style.color = 'rgba(255, 180, 180, 0.8)';
                },
                update: (dt) => {
                    soft.update(dt);
                    // Environmental push - they are drawn together
                    const dx = soft.pos.x - sharp.pos.x;
                    const dy = soft.pos.y - sharp.pos.y;
                    const dist = Math.hypot(dx, dy);
                    
                    // Cruel gravity pulls them together
                    sharp.pos.x += (dx / dist) * 20 * dt;
                    sharp.pos.y += (dy / dist) * 20 * dt;
                    sharp.targetPos.x = sharp.pos.x;
                    sharp.targetPos.y = sharp.pos.y;

                    if (dist < 80) {
                        triggerShatter(soft);
                        soft = null;
                        game.transitionCallback = () => startChapter(5);
                    }
                }
            },
            {
                title: "V. The Vastness",
                text: "I am the sharpness in the dark. And I love you from afar.",
                setup: () => {
                    sharp = new SharpShape(width/2, height - 150);
                    soft = new SoftShape(width/2, height/2 - 200, 'distant');
                    environment = new Environment(width, height, 4);
                    camera.targetScale = 0.6;
                    camera.targetX = -width/2 + width/2;
                    camera.targetY = -height/2 + height/2 + 100;
                    textOverlay.style.color = 'rgba(255, 200, 200, 0.5)';
                },
                update: (dt) => {
                    soft.update(dt);
                    // Sharp is frozen, watching
                }
            }
        ];

        function startChapter(num) {
            game.state = 'transitioning';
            game.chapter = num;
            game.transitionDirection = 1; // Fade in
            game.targetAlpha = 1;
            
            if (num <= storyData.length) {
                const chapter = storyData[num - 1];
                chapterTitle.innerText = chapter.title;
                storyText.innerText = chapter.text;
                chapter.setup();
                particles = [];
            }
        }

        function triggerShatter(entity) {
            // Create particles
            for (let i = 0; i < 100; i++) {
                particles.push(new Particle(entity.pos.x, entity.pos.y, entity.color));
            }
            // Audio shatter
            if (audioCtx) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            }
            game.state = 'transitioning';
            game.transitionDirection = -1; // Fade out
            game.targetAlpha = 0;
        }

        // Main Loop
        let lastTime = performance.now();
        
        function loop(time) {
            const dt = Math.min((time - lastTime) / 1000, 0.1); // Cap dt
            lastTime = time;

            // Update
            if (game.state === 'playing' || game.state === 'transitioning') {
                const currentChapter = storyData[game.chapter - 1];
                if (currentChapter && currentChapter.update) {
                    currentChapter.update(dt);
                }

                if (sharp) sharp.update(dt, camera);
                if (environment) environment.update(dt);
                
                particles.forEach((p, index) => {
                    p.update(dt);
                    if (p.life <= 0) particles.splice(index, 1);
                });

                // Camera easing
                camera.x += (camera.targetX - camera.x) * 5 * dt;
                camera.y += (camera.targetY - camera.y) * 5 * dt;
                camera.scale += (camera.targetScale - camera.scale) * 3 * dt;
            }

            // Transition logic
            if (game.state === 'transitioning') {
                if (game.transitionDirection === 1) {
                    game.transitionAlpha += dt * 0.5;
                    if (game.transitionAlpha >= 1) {
                        game.transitionAlpha = 1;
                        game.state = 'playing';
                    }
                } else {
                    game.transitionAlpha -= dt * 0.5;
                    if (game.transitionAlpha <= 0) {
                        game.transitionAlpha = 0;
                        if (game.transitionCallback) {
                            const cb = game.transitionCallback;
                            game.transitionCallback = null;
                            cb();
                        }
                    }
                }
                
                // Update text overlay opacity
                textOverlay.style.opacity = game.transitionAlpha;
            }

            // Render
            ctx.clearRect(0, 0, width, height);
            
            ctx.save();
            ctx.translate(camera.x, camera.y);
            ctx.scale(camera.scale, camera.scale);

            if (environment) environment.draw(ctx);
            
            particles.forEach(p => p.draw(ctx));

            if (soft && game.state !== 'transitioning') soft.draw(ctx);
            if (sharp) sharp.draw(ctx);

            ctx.restore();

            // Draw transition veil
            if (game.transitionAlpha > 0) {
                ctx.fillStyle = `rgba(13, 9, 9, ${game.transitionAlpha * 0.7})`;
                ctx.fillRect(0, 0, width, height);
            }

            requestAnimationFrame(loop);
        }

        // Start
        requestAnimationFrame(loop);

    </script>
</body>
</html>
